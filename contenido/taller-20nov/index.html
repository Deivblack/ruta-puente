<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Kit taller 20 nov · Ruta Puente</title>
<link rel="icon" href="../../logo-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#f5f7f4; --surface:#fff; --ink:#1f2a26; --muted:#5d6c66; --line:#dde5e0;
  --hope:#2e7d5b; --hope-soft:#e1efe7; --hope-ink:#fff; --sun:#e8b04b; --sun-soft:#fbf0d9;
  --err:#b4462f;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--f-body);padding:0 16px 80px}
.wrap{max-width:560px;margin:0 auto}
h1,h2{font-family:var(--f-display);line-height:1.15;margin:0}
p{margin:0}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0}
.brand{font:800 20px var(--f-display)}
.link{background:none;border:0;color:var(--hope);font:700 15px var(--f-body);padding:8px 0;cursor:pointer}
.login{max-width:420px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px}
.login h1{font-size:1.5rem}
.login p{color:var(--muted);font-size:.95rem}
label{font-weight:800}
input[type=password]{font:17px var(--f-body);color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
input:focus{border-color:var(--hope);outline:none}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;font:800 17px var(--f-body);border:0;border-radius:999px;padding:12px 18px;cursor:pointer;text-decoration:none;background:var(--hope);color:var(--hope-ink);text-align:center}
.btn.ghost{background:transparent;color:var(--hope);border:2px solid var(--line)}
.btn.sun{background:var(--sun);color:var(--ink)}
.btn:disabled{opacity:.55}
.acciones{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px}
.sec{font-size:1.25rem;margin:24px 0 10px}
.muted{color:var(--muted);font-size:.92rem}
.err{color:var(--err);font-weight:800}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:var(--hope-soft);border-radius:999px;padding:4px 10px;font-weight:800;font-size:.85rem;border:0;color:var(--ink);cursor:pointer;font-family:var(--f-body)}
.chip.on{background:var(--hope);color:var(--hope-ink)}
.filtros{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 8px}
.arte{display:block;width:auto;max-width:100%;max-height:360px;height:auto;margin:10px auto;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.copy{white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px;background:var(--bg);border-radius:12px;padding:12px;margin-top:8px}
.toast{position:fixed;left:16px;right:16px;bottom:16px;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-weight:800;text-align:center;z-index:5}
.obj{font-weight:800;margin-top:6px}
</style>
</head>
<body>
<form class="login" id="login" hidden method="post" action="#">
  <h1>Kit del taller</h1>
  <p>Página privada para David y Diana. Escribe la clave de la Bitácora. Este celular la recordará.</p>
  <label for="clave">Clave</label>
  <input type="password" id="clave" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
  <span class="err" id="login-err" hidden></span>
  <button class="btn" id="login-btn" type="submit">Entrar</button>
</form>

<div class="wrap" id="main" hidden>
  <header class="top">
    <div class="brand">Kit taller 20 nov</div>
    <button class="link" id="logout" type="button">Salir</button>
  </header>
  <p class="muted" id="dato-taller"></p>
  <div class="filtros" id="filtros"></div>
  <div id="dias"></div>
  <h2 class="sec">Artes extra</h2>
  <p class="muted">Las que no salen en un día concreto: posts, cuenta regresiva y láminas del carrusel.</p>
  <div id="extra"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwMKLgkkTPKJahu1wvk9TkTeuhYcnjElm7IIQ5jH8PqB51r_LCKzcrWrcLYG4shRt0w/exec";
const $ = s => document.querySelector(s);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const DIAS = {
  "2026-11-14": "Sábado 14",
  "2026-11-15": "Domingo 15",
  "2026-11-16": "Lunes 16",
  "2026-11-18": "Miércoles 18",
  "2026-11-19": "Jueves 19",
  "2026-11-20": "Viernes 20",
  "2026-11-21": "Sábado 21"
};
const CANAL = { whatsapp:"WhatsApp", facebook:"Facebook", instagram:"Instagram", tiktok:"TikTok", estado:"Estado / historia" };
let clave = store.get("rp-bit-clave") || "";
let cal = null;
let manifiesto = null;
let filtro = "Todos";

function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toast._id);
  toast._id = setTimeout(() => { t.hidden = true; }, 2200);
}
function el(tag, attrs, kids){
  const n = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(k => {
    if (k === "text") n.textContent = attrs[k];
    else n.setAttribute(k, attrs[k]);
  });
  (kids || []).forEach(c => { if (c) n.appendChild(c); });
  return n;
}
async function copiar(texto){
  try {
    await navigator.clipboard.writeText(texto);
    toast("Texto copiado");
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = texto;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
    toast("Texto copiado");
  }
}
async function descargar(src, name){
  try {
    const r = await fetch(src);
    const b = await r.blob();
    const url = URL.createObjectURL(b);
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2500);
    toast("Si no se bajó, mantén pulsada la imagen");
  } catch (e) {
    window.open(src, "_blank");
  }
}
function wa(texto){
  return "https://wa.me/?text=" + encodeURIComponent(texto);
}
function visible(p){
  if (filtro === "Todos") return true;
  return p.quien === filtro;
}
function tarjeta(p, opts){
  const card = el("article", { class:"card", "data-quien": p.quien || "" });
  const tit = el("p", { class:"obj", text: p.objetivo || p.archivo || p.id || "" });
  card.appendChild(tit);
  const meta = el("div", { class:"meta" });
  if (p.quien) meta.appendChild(el("span", { class:"chip", text: p.quien }));
  if (p.canal) meta.appendChild(el("span", { class:"chip", text: CANAL[p.canal] || p.canal }));
  if (p.hora) meta.appendChild(el("span", { class:"chip", text: p.hora }));
  card.appendChild(meta);
  const artes = (p.artes && p.artes.length) ? p.artes : (p.arte ? [p.arte] : (p.archivo ? [p.archivo] : []));
  artes.forEach(nom => {
    const img = el("img", { class:"arte", alt: "Arte " + nom, src: "artes/" + nom });
    card.appendChild(img);
    const dl = el("button", { class:"btn ghost", type:"button", text:"Descargar imagen" });
    dl.addEventListener("click", () => descargar("artes/" + nom, nom));
    card.appendChild(dl);
  });
  if (p.copy){
    const pre = el("pre", { class:"copy" });
    pre.textContent = p.copy;
    card.appendChild(pre);
    const acc = el("div", { class:"acciones" });
    const b1 = el("button", { class:"btn", type:"button", text:"Copiar texto" });
    b1.addEventListener("click", () => copiar(p.copy));
    acc.appendChild(b1);
    const a = el("a", { class:"btn sun", href: wa(p.copy), text:"Abrir WhatsApp", target:"_blank", rel:"noopener" });
    acc.appendChild(a);
    card.appendChild(acc);
  }
  return card;
}
function pintar(){
  const box = $("#dias");
  box.textContent = "";
  const porDia = {};
  (cal.piezas || []).forEach(p => {
    if (!visible(p)) return;
    (porDia[p.fecha] = porDia[p.fecha] || []).push(p);
  });
  Object.keys(DIAS).forEach(fecha => {
    const lista = porDia[fecha];
    if (!lista || !lista.length) return;
    box.appendChild(el("h2", { class:"sec", text: DIAS[fecha] }));
    lista.forEach(p => box.appendChild(tarjeta(p)));
  });
  const usados = {};
  (cal.piezas || []).forEach(p => {
    (p.artes || (p.arte ? [p.arte] : [])).forEach(a => { usados[a] = true; });
  });
  const extra = $("#extra");
  extra.textContent = "";
  const arts = (manifiesto && manifiesto.piezas) || [];
  const quienExtra = filtro === "Diana" ? "diana" : filtro === "David" ? "david" : "";
  arts.forEach(a => {
    if (usados[a.archivo]) return;
    const esDiana = /-diana\.png$/.test(a.archivo);
    if (quienExtra === "diana" && !esDiana) return;
    if (quienExtra === "david" && esDiana) return;
    extra.appendChild(tarjeta({
      archivo: a.archivo,
      arte: a.archivo,
      objetivo: a.tipo + " · " + a.formato + " · utm=" + a.utm,
      quien: esDiana ? "Diana" : "David"
    }));
  });
  if (!extra.childNodes.length) extra.appendChild(el("p", { class:"muted", text:"No hay artes extra con este filtro." }));
}
function setFiltro(v){
  filtro = v;
  document.querySelectorAll("#filtros .chip").forEach(c => c.classList.toggle("on", c.getAttribute("data-f") === v));
  pintar();
}
function pintarFiltros(){
  const f = $("#filtros");
  f.textContent = "";
  ["Todos","David","Diana"].forEach(n => {
    const b = el("button", { class:"chip" + (n === filtro ? " on" : ""), type:"button", "data-f": n, text: n });
    b.addEventListener("click", () => setFiltro(n));
    f.appendChild(b);
  });
}
function mostrarLogin(msg){
  $("#main").hidden = true;
  $("#login").hidden = false;
  if (msg){ $("#login-err").textContent = msg; $("#login-err").hidden = false; }
}
async function entrar(){
  if (!clave) return mostrarLogin();
  $("#login-btn").disabled = true;
  $("#login-err").hidden = true;
  let r;
  try {
    const res = await fetch(SCRIPT_URL, { method:"POST", body: JSON.stringify({ clave: clave, accion:"listar" }) });
    r = await res.json();
  } catch (e) {
    $("#login-btn").disabled = false;
    return mostrarLogin("No hay conexión. Revisa tu internet e intenta de nuevo.");
  }
  $("#login-btn").disabled = false;
  if (!r || !r.ok){
    store.del("rp-bit-clave");
    clave = "";
    return mostrarLogin(r && r.error === "clave" ? "Esa clave no es correcta." : "La hoja respondió con un error.");
  }
  store.set("rp-bit-clave", clave);
  try {
    cal = await (await fetch("calendario.json")).json();
    manifiesto = await (await fetch("artes.json")).json();
  } catch (e) {
    return mostrarLogin("No pude cargar el calendario. Recarga la página.");
  }
  const t = cal.taller || {};
  $("#dato-taller").textContent = (t.titulo || "") + " · " + (t.fecha || "") + " · " + (t.hora || "") + " · " + (t.lugar || "");
  $("#login").hidden = true;
  $("#main").hidden = false;
  pintarFiltros();
  pintar();
}
$("#login").addEventListener("submit", e => { e.preventDefault(); clave = $("#clave").value.trim(); entrar(); });
$("#logout").addEventListener("click", () => { store.del("rp-bit-clave"); clave = ""; mostrarLogin(); });
if (clave) entrar(); else mostrarLogin();
</script>
</body>
</html>
