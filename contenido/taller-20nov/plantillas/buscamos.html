<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Buscamos profesionales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{
  --hope:#2e7d5b; --sun:#e8b04b; --ink:#1f2a26;
  --f-d:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-b:"Nunito","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#111;margin:0}
#lienzo{
  position:relative; overflow:hidden;
  background:#0c0f0e; color:#fff;
  font-family:var(--f-b);
}
#lienzo[data-formato="historia"]{width:1080px;height:1920px}
#lienzo[data-formato="post"]{width:1080px;height:1350px}
#lienzo[data-formato="facebook"]{width:1080px;height:1080px}

.swoosh{position:absolute;inset:0;pointer-events:none;z-index:0}
.swoosh path{fill:none;stroke:#fff;stroke-opacity:.22;stroke-width:90;stroke-linecap:round}

.logo{
  position:absolute; z-index:3;
  background:#fff; color:var(--ink);
  display:flex; align-items:center; gap:12px;
  border-radius:22px; padding:12px 18px 12px 14px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}
.logo svg{width:56px;height:56px;flex:0 0 auto}
.logo b{font-family:var(--f-d);font-weight:800;font-size:28px;letter-spacing:-.03em;line-height:1}
.logo span{display:block;font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--hope)}
#lienzo[data-formato="historia"] .logo{top:268px;left:64px}
#lienzo[data-formato="post"] .logo{top:48px;left:48px}
#lienzo[data-formato="facebook"] .logo{top:36px;left:36px}

.foto{
  position:absolute; z-index:1; overflow:hidden;
  background:#1a2420;
}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto::after{
  content:""; position:absolute; inset:auto 0 0 0; height:42%;
  background:linear-gradient(transparent, #0c0f0e 78%);
}
#lienzo[data-formato="historia"] .foto{
  top:250px; right:-10px; width:560px; height:980px;
  clip-path: polygon(16% 0, 100% 0, 100% 100%, 0 100%);
}
#lienzo[data-formato="post"] .foto{
  top:0; right:-16px; width:530px; height:900px;
  clip-path: polygon(22% 0, 100% 0, 100% 100%, 0 86%);
}
#lienzo[data-formato="facebook"] .foto{
  top:0; right:-20px; width:520px; height:760px;
  clip-path: polygon(24% 0, 100% 0, 100% 100%, 0 82%);
}
#lienzo[data-formato="historia"] .foto img{object-position:62% 10%}
#lienzo[data-formato="post"] .foto img{object-position:72% 8%}
#lienzo[data-formato="facebook"] .foto img{object-position:74% 6%}

.foto-borde{
  position:absolute; z-index:2; pointer-events:none;
  border:6px solid rgba(232,176,75,.85);
}
#lienzo[data-formato="historia"] .foto-borde{
  top:268px; right:28px; width:460px; height:740px;
  clip-path: polygon(16% 0, 100% 0, 100% 100%, 0 100%);
  border:0; box-shadow: inset 0 0 0 6px rgba(232,176,75,.8);
}
#lienzo[data-formato="post"] .foto-borde,
#lienzo[data-formato="facebook"] .foto-borde{display:none}

.copy{position:absolute; z-index:3}
#lienzo[data-formato="historia"] .copy{top:380px;left:64px;width:500px}
#lienzo[data-formato="post"] .copy{top:48px;left:48px;width:560px}
#lienzo[data-formato="facebook"] .copy{top:36px;left:36px;width:560px}

.kicker{
  display:flex; align-items:center; gap:14px;
  font-family:var(--f-d); font-weight:800;
  letter-spacing:-.03em; line-height:.9;
  background:linear-gradient(180deg,#fff 10%,#d7d7d7 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.kicker svg{flex:0 0 auto; filter:drop-shadow(0 2px 0 #000)}
#lienzo[data-formato="historia"] .kicker{font-size:58px;margin-top:0}
#lienzo[data-formato="post"] .kicker{font-size:56px;margin-top:92px}
#lienzo[data-formato="facebook"] .kicker{font-size:48px;margin-top:86px}

h1{
  font-family:var(--f-d); font-weight:800; letter-spacing:-.04em; line-height:.86;
  margin:10px 0 16px;
}
h1 i{
  font-style:normal; display:inline-block;
  background:#111; color:#fff;
  padding:.08em .18em .1em;
  transform:rotate(-1.4deg);
  border:4px solid #fff;
  box-shadow:7px 7px 0 var(--sun);
}
#lienzo[data-formato="historia"] h1{font-size:62px}
#lienzo[data-formato="post"] h1{font-size:64px}
#lienzo[data-formato="facebook"] h1{font-size:54px}

.sub{
  font-weight:800; line-height:1.2; color:#f5f7f4;
  max-width:18ch;
}
#lienzo[data-formato="historia"] .sub{font-size:36px;max-width:none}
#lienzo[data-formato="post"] .sub{font-size:28px}
#lienzo[data-formato="facebook"] .sub{font-size:24px}

.lead{
  margin-top:14px; font-weight:700; color:#d5e4dc; line-height:1.25;
}
#lienzo[data-formato="historia"] .lead{font-size:30px}
#lienzo[data-formato="post"] .lead{font-size:22px;max-width:22ch}
#lienzo[data-formato="facebook"] .lead{font-size:20px;max-width:22ch}

.beneficios{
  position:absolute; z-index:3; left:40px; right:40px;
  background:linear-gradient(180deg,#1a1f1d,#111);
  border:3px solid #e8e8e8;
  border-radius:28px;
  padding:18px 16px 20px;
}
#lienzo[data-formato="historia"] .beneficios{bottom:420px;padding:28px 24px}
#lienzo[data-formato="post"] .beneficios{bottom:168px}
#lienzo[data-formato="facebook"] .beneficios{bottom:140px}
.beneficios h2{
  text-align:center; font-family:var(--f-d); font-weight:800;
  letter-spacing:.04em; margin-bottom:14px;
}
#lienzo[data-formato="historia"] .beneficios h2{font-size:32px;margin-bottom:22px}
#lienzo[data-formato="post"] .beneficios h2{font-size:24px}
#lienzo[data-formato="facebook"] .beneficios h2{font-size:22px}
.tres{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.item{text-align:center;padding:8px 8px 4px}
.item svg{width:52px;height:52px;display:block;margin:0 auto 8px}
#lienzo[data-formato="historia"] .item svg{width:72px;height:72px}
#lienzo[data-formato="facebook"] .item svg{width:44px;height:44px}
.item p{
  font-weight:800; line-height:1.15; color:#f5f7f4;
}
#lienzo[data-formato="historia"] .item p{font-size:28px}
#lienzo[data-formato="post"] .item p{font-size:22px}
#lienzo[data-formato="facebook"] .item p{font-size:20px}

.cta{
  position:absolute; z-index:3; left:40px; right:40px;
  background:#fff; color:var(--ink);
  border-radius:999px;
  display:flex; align-items:center; gap:18px;
  padding:12px 22px 12px 12px;
  box-shadow:0 12px 30px rgba(0,0,0,.4);
}
#lienzo[data-formato="historia"] .cta{bottom:250px;padding:16px 28px 16px 16px}
#lienzo[data-formato="post"] .cta{bottom:40px}
#lienzo[data-formato="facebook"] .cta{bottom:28px}
.cta img{width:92px;height:92px;border-radius:18px;flex:0 0 auto;background:#fff}
#lienzo[data-formato="historia"] .cta img{width:120px;height:120px}
#lienzo[data-formato="facebook"] .cta img{width:84px;height:84px}
.cta strong{
  display:block; font-family:var(--f-d); font-weight:800; letter-spacing:-.03em; line-height:1;
}
#lienzo[data-formato="historia"] .cta strong{font-size:42px}
#lienzo[data-formato="post"] .cta strong{font-size:34px}
#lienzo[data-formato="facebook"] .cta strong{font-size:30px}
.cta span{display:block;font-weight:800;color:#3d4a45;margin-top:4px}
#lienzo[data-formato="historia"] .cta span{font-size:26px}
#lienzo[data-formato="post"] .cta span{font-size:20px}
#lienzo[data-formato="facebook"] .cta span{font-size:18px}
</style>
</head>
<body>
<div id="lienzo" data-formato="facebook">
  <svg class="swoosh" viewBox="0 0 1080 1080" preserveAspectRatio="none" aria-hidden="true">
    <path d="M-80 180 C 220 40, 520 260, 1180 80"/>
    <path d="M-60 980 C 300 860, 760 1040, 1180 900"/>
  </svg>
  <div class="foto"><img id="foto" alt="" src="foto-profesional.jpg"></div>
  <div class="logo">
    <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M20 40a12 12 0 0 1 24 0Z" fill="#E8B04B"/><path d="M9 54 C 16 14, 48 14, 55 54" fill="none" stroke="#2E7D5B" stroke-width="5.5" stroke-linecap="round"/><path d="M4 40h56" stroke="#1D2B26" stroke-width="5" stroke-linecap="round"/></svg>
    <b>Ruta Puente<span>Houston</span></b>
  </div>
  <div class="copy">
    <p class="kicker">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <path d="M10 26h16l22-12v36L26 38H10a4 4 0 0 1-4-4v-4a4 4 0 0 1 4-4Z" fill="#fff" stroke="#111" stroke-width="3"/>
        <path d="M52 24c4 4 4 12 0 16" stroke="#e8b04b" stroke-width="4" stroke-linecap="round"/>
      </svg>
      ¡BUSCAMOS
    </p>
    <h1><i>PROFESIONALES!</i></h1>
    <p class="sub">que quieran volver a trabajar en su área</p>
    <p class="lead">Taller gratis el viernes 20 de noviembre en Houston.</p>
  </div>
  <div class="beneficios">
    <h2>BENEFICIOS DEL TALLER</h2>
    <div class="tres">
      <div class="item">
        <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <rect x="6" y="14" width="52" height="34" rx="5" fill="#fff"/>
          <rect x="10" y="18" width="44" height="22" rx="2" fill="#0c0f0e"/>
          <path d="M16 48h32" stroke="#e8b04b" stroke-width="5" stroke-linecap="round"/>
          <path d="M20 26h10M20 32h16" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <p>Tu cargo en inglés</p>
      </div>
      <div class="item">
        <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <path d="M16 8h22l14 14v34a4 4 0 0 1-4 4H16a4 4 0 0 1-4-4V12a4 4 0 0 1 4-4Z" fill="#fff"/>
          <path d="M38 8v14h14" fill="#e8b04b"/>
          <path d="M22 34h20M22 42h14" stroke="#0c0f0e" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <p>Un logro claro en tu CV</p>
      </div>
      <div class="item">
        <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <circle cx="32" cy="32" r="22" fill="#fff"/>
          <path d="M32 18v14l10 6" stroke="#0c0f0e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="32" cy="32" r="4" fill="#e8b04b"/>
        </svg>
        <p>Cómo presentarte en 30 s</p>
      </div>
    </div>
  </div>
  <div class="cta">
    <img id="qr" alt="" width="92" height="92">
    <div>
      <strong>Inscríbete al taller</strong>
      <span id="cta-sub">Gratis · 10 cupos · viernes 20 nov</span>
    </div>
  </div>
</div>
<script>
window.pintar = async function(p){
  const lienzo = document.getElementById("lienzo");
  lienzo.setAttribute("data-formato", p.formato);
  const t = p.taller || {};
  const sub = document.getElementById("cta-sub");
  sub.textContent = "Gratis · 10 cupos · viernes 20 nov · Houston";
  const qr = document.getElementById("qr");
  if (p.qr){
    qr.src = p.qr;
    if (!qr.complete){
      await new Promise((resolve, reject) => {
        qr.onload = resolve;
        qr.onerror = reject;
      });
    }
  }
  const foto = document.getElementById("foto");
  if (!foto.complete){
    await new Promise((resolve, reject) => {
      foto.onload = resolve;
      foto.onerror = reject;
    });
  }
};
</script>
</body>
</html>
