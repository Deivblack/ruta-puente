<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Kit de difusión · diagnóstico de inglés · Ruta Puente</title>
<link rel="icon" href="../logo-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#f5f7f4; --surface:#ffffff; --ink:#1f2a26; --muted:#5d6c66; --line:#dde5e0;
  --hope:#2e7d5b; --hope-soft:#e1efe7; --hope-ink:#ffffff; --sun:#e8b04b; --sun-soft:#fbf0d9;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111a17; --surface:#18241f; --ink:#e7efea; --muted:#a2b2ab; --line:#2a3a33;
  --hope:#5fbf8f; --hope-soft:#1f3a2e; --hope-ink:#0f1a15; --sun:#f0c062; --sun-soft:#3a3120; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--f-body);padding:0 16px 48px}
.wrap{max-width:720px;margin:0 auto}
a{color:var(--hope)}
h1,h2{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
.top{display:flex;align-items:center;gap:10px;padding:18px 0}
.brand{display:flex;align-items:center;gap:10px;font:800 20px var(--f-display);color:var(--ink);text-decoration:none}
.brand svg{width:34px;height:34px}
.hint{font-size:15px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;margin:12px 0}
.card h2{font-size:18px}
.url{font-weight:700;word-break:break-all;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;font:800 16px var(--f-body);border:0;border-radius:999px;padding:12px 18px;cursor:pointer;background:var(--hope);color:var(--hope-ink)}
.ok{font-weight:800;color:var(--hope);min-height:1.2em}
footer{padding:28px 0 8px;text-align:center;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="../">
      <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M20 40a12 12 0 0 1 24 0Z" fill="#E8B04B"/><path d="M9 54 C 16 14, 48 14, 55 54" fill="none" stroke="var(--hope)" stroke-width="5.5" stroke-linecap="round"/><path d="M4 40h56" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/></svg>
      Ruta Puente
    </a>
  </header>
  <h1>Kit de difusión</h1>
  <p class="hint" style="margin:10px 0 18px">Gancho del diagnóstico. Copia el enlace según el canal. Esta página no se indexa.</p>

  <article class="card" data-utm="whatsapp">
    <h2>WhatsApp (grupos)</h2>
    <p class="url" id="u-whatsapp"></p>
    <button class="btn" type="button" data-copy="u-whatsapp">Copiar enlace</button>
    <p class="ok" hidden></p>
  </article>
  <article class="card" data-utm="tiktok">
    <h2>TikTok</h2>
    <p class="url" id="u-tiktok"></p>
    <button class="btn" type="button" data-copy="u-tiktok">Copiar enlace</button>
    <p class="ok" hidden></p>
  </article>
  <article class="card" data-utm="estado">
    <h2>Estado / historia</h2>
    <p class="url" id="u-estado"></p>
    <button class="btn" type="button" data-copy="u-estado">Copiar enlace</button>
    <p class="ok" hidden></p>
  </article>

  <footer>Solo para armar mensajes. Sin datos personales.</footer>
</div>
<script>
const BASE = "https://deivblack.github.io/ruta-puente/ingles/?utm=";
["whatsapp","tiktok","estado"].forEach(utm => {
  document.getElementById("u-"+utm).textContent = BASE + utm;
});
document.querySelectorAll("[data-copy]").forEach(btn => {
  btn.addEventListener("click", async () => {
    const el = document.getElementById(btn.getAttribute("data-copy"));
    const txt = el ? el.textContent : "";
    try { await navigator.clipboard.writeText(txt); }
    catch(e){
      const t = document.createElement("textarea"); t.value = txt; document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); } catch(err){}
      t.remove();
    }
    const ok = btn.parentElement.querySelector(".ok");
    if (ok){ ok.hidden = false; ok.textContent = "Copiado."; }
  });
});
</script>
</body>
</html>
